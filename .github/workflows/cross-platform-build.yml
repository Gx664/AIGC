name: 三端构建（Linux / macOS）

# Linux 与 macOS 都在**云端**构建，本地不需要装任何 Linux / macOS 环境。
# 触发方式：手动（Actions 页面 Run workflow）或打 v* tag。
#
# 产物形态：
#   Linux -> AppImage（单文件，双击即用）
#   macOS -> dmg（拖进 Applications 即用）
# 两者内部都带一份便携 Python（runtime/python），首次启动时由 app/first_run.py
# 复制到用户目录并按需安装 PySide6 / PyTorch 等组件（对应 Windows 的引导器）。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # 便携 Python 主次版本（python-build-standalone 的 install_only 包）
  PY_SERIES: '3.12'

jobs:
  linux:
    name: Linux 构建
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            tk jq curl

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          # 只装打包必需的。torch / PySide6 / transformers 故意不装 ——
          # app/ 对它们全是延迟 import，靠 PyInstaller 静态分析也不会被收集；
          # 打进去只会让产物膨胀到 GB 级，它们由用户首次启动时按需安装。
          python -m pip install 'pyinstaller>=6.6'

      - name: 语法自检
        run: python -m compileall -q app installer packaging

      - name: 引擎回归测试（不需要 torch）
        run: python tools/test_engines.py

      - name: 清理字节码缓存（别打进产物）
        run: find . -name __pycache__ -type d -prune -exec rm -rf {} +

      - name: 下载并解压便携 Python
        env:
          # 未认证调 api.github.com 是 60 次/小时的【出口 IP 共享】额度，CI runner
          # 的 IP 被别人用光了就返回 403，JSON 里没有 assets → jq 报
          # "Cannot iterate over null"（macOS job 第一次实跑就栽在这）。
          # 带上 workflow 自带的 token 提到 5000 次/小时。
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "x86_64" ]; then
            TRIPLE=x86_64-unknown-linux-gnu
          else
            TRIPLE=aarch64-unknown-linux-gnu
          fi
          JSON=$(bash .github/scripts/fetch_pbs_assets.sh)
          # 从最新 release 里挑一个匹配本机架构的 3.12 install_only 包
          INFO=$(printf '%s' "$JSON" \
            | jq -r --arg s "^cpython-${PY_SERIES}\\.[0-9]+\\+[0-9]+-${TRIPLE}-install_only\\.tar\\.gz$" \
              '.tag_name as $t | .assets[] | select(.name | test($s)) | "\($t) \(.name)"' \
            | head -1)
          test -n "$INFO" || { echo "没找到匹配的便携 Python 资产"; exit 1; }
          TAG=${INFO%% *}; ASSET=${INFO#* }
          echo "release=$TAG asset=$ASSET"
          curl -fsSL --retry 3 --retry-delay 3 -o /tmp/py.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/$TAG/$ASSET"
          # install_only 包解压出来就是 python/ 目录
          mkdir -p runtime
          tar -xzf /tmp/py.tar.gz -C runtime
          test -x runtime/python/bin/python3
          runtime/python/bin/python3 -VV

      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --distpath dist-unix --workpath build-unix \
            packaging/AIGC_Toolkit_unix.spec

      - name: 把便携 Python 放进产物
        run: |
          set -euo pipefail
          cp -a runtime dist-unix/AIGC_Toolkit/
          test -x dist-unix/AIGC_Toolkit/runtime/python/bin/python3
          du -sh dist-unix/AIGC_Toolkit

      - name: 产物自检（不启动界面）
        run: |
          set -euo pipefail
          APP="$PWD/dist-unix/AIGC_Toolkit"        # 必须绝对：下面会 cd 进产物
          test -x "$APP/AIGC_Toolkit"
          echo "===== 产物布局（留档，别删）====="
          ls -la "$APP"
          find "$APP" -maxdepth 3 -name app -type d -print
          du -sh "$APP"
          # app/ 的实际位置随 PyInstaller 版本变（6.x 起放进 _internal/），
          # 判据只认"哪里有 app/main.py"，不写死任何一层目录名
          APP_MAIN=$(find "$APP" -maxdepth 4 -type f -path '*/app/main.py' | head -1)
          test -n "$APP_MAIN" || { echo "产物里找不到 app/main.py"; exit 1; }
          APP_SRC=$(dirname "$APP_MAIN")
          test -f "$APP_SRC/first_run.py" || { echo "app/ 里缺 first_run.py"; exit 1; }
          echo "app/ 源码目录 = $APP_SRC"
          # 用产物自带的解释器跑一遍适配层，确认 app/ 与核心模块能被加载
          cd "$APP"
          ./runtime/python/bin/python3 -c \
            "import sys; sys.path.insert(0, sys.argv[1]); from core import platform_ops; print('OK', platform_ops.describe())" \
            "$APP_SRC"

      - name: 打 AppImage
        run: |
          set -euo pipefail
          VER=$(sed -n 's/.*APP_VERSION *= *"\([^"]*\)".*/\1/p' app/core/meta.py | head -1)
          APPDIR=AIGC_Toolkit.AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"
          cp -a dist-unix/AIGC_Toolkit "$APPDIR/AIGC_Toolkit"
          cp app/assets/icon.png "$APPDIR/aigc-toolkit.png"
          cat > "$APPDIR/aigc-toolkit.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AIGC 检测工具箱
          Comment=中文 AI 生成文本检测（离线运行）
          Exec=AIGC_Toolkit
          Icon=aigc-toolkit
          Categories=Utility;TextTools;
          Terminal=false
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/AIGC_Toolkit/AIGC_Toolkit" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          # CI 容器里没有 FUSE，用 APPIMAGE_EXTRACT_AND_RUN 直接解包执行。
          # 主地址优先，拿不到再回退到旧的 AppImageKit 仓库（两处都能用）。
          if ! curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage; then
            curl -fsSL -o /tmp/appimagetool \
              https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          fi
          chmod +x /tmp/appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool \
            "$APPDIR" "AIGC_Toolkit-${VER}-x86_64.AppImage"
          ls -lh AIGC_Toolkit-*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: AIGC-Toolkit-Linux
          # 只传单文件 AppImage。AppImage 内部装的就是同一份 onedir 内容，
          # 再连 dist-unix/AIGC_Toolkit/ 整个目录一起传属于重复上传
          # （实测 264 MB，其实 88 MB 就够），而且 Release 只需要单文件。
          path: AIGC_Toolkit-*.AppImage

  macos:
    name: macOS 构建
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pyinstaller>=6.6'

      - name: 由 PNG 生成 .icns
        run: |
          rm -rf packaging/icon.iconset
          mkdir -p packaging/icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s app/assets/icon.png --out "packaging/icon.iconset/icon_${s}x${s}.png" >/dev/null
          done
          cp app/assets/icon.png packaging/icon.iconset/icon_512x512@2x.png
          iconutil -c icns packaging/icon.iconset -o packaging/icon.icns
          ls -l packaging/icon.icns

      - name: 语法自检
        run: python -m compileall -q app installer packaging

      - name: 引擎回归测试（不需要 torch）
        run: python tools/test_engines.py

      - name: 清理字节码缓存（别打进产物）
        run: find . -name __pycache__ -type d -prune -exec rm -rf {} +

      - name: 下载并解压便携 Python
        env:
          # 同 Linux job：匿名调 api.github.com 是出口 IP 共享额度，容易被限流
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            TRIPLE=aarch64-apple-darwin
          else
            TRIPLE=x86_64-apple-darwin
          fi
          JSON=$(bash .github/scripts/fetch_pbs_assets.sh)
          INFO=$(printf '%s' "$JSON" \
            | jq -r --arg s "^cpython-${PY_SERIES}\\.[0-9]+\\+[0-9]+-${TRIPLE}-install_only\\.tar\\.gz$" \
              '.tag_name as $t | .assets[] | select(.name | test($s)) | "\($t) \(.name)"' \
            | head -1)
          test -n "$INFO" || { echo "没找到匹配的便携 Python 资产"; exit 1; }
          TAG=${INFO%% *}; ASSET=${INFO#* }
          echo "release=$TAG asset=$ASSET"
          curl -fsSL --retry 3 --retry-delay 3 -o /tmp/py.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/$TAG/$ASSET"
          mkdir -p runtime
          tar -xzf /tmp/py.tar.gz -C runtime
          test -x runtime/python/bin/python3
          runtime/python/bin/python3 -VV

      - name: PyInstaller 打包
        run: |
          pyinstaller --noconfirm --distpath dist-unix --workpath build-unix \
            packaging/AIGC_Toolkit_unix.spec

      - name: 把便携 Python 放进 .app
        run: |
          set -euo pipefail
          cp -a runtime "dist-unix/AIGC_Toolkit.app/Contents/MacOS/"
          test -x "dist-unix/AIGC_Toolkit.app/Contents/MacOS/runtime/python/bin/python3"
          du -sh "dist-unix/AIGC_Toolkit.app"

      - name: 重新签名 .app（拷进 runtime 会破坏原有签名）
        run: |
          set -euo pipefail
          APP="dist-unix/AIGC_Toolkit.app"
          # PyInstaller 打包时已经做过一次 ad-hoc 签名（日志里的
          # "Code signing identity: None" + "Signing the BUNDLE..."），
          # 但上一步往 Contents/MacOS/ 拷进了 runtime/（400+ MB）。
          # bundle 的 _CodeSignature/CodeResources 记录的是签名那一刻的内容哈希，
          # 事后增删文件必然失配 —— 结果 Gatekeeper 会把应用判成
          # 「已损坏，应该移到废纸篓」，而不是温和的「未识别开发者」，
          # 用户很容易被吓到直接删掉。所以这里必须整体重签一次。
          # 没买开发者证书，只能用 ad-hoc（-）签名：足够让系统加载运行，
          # 但不代表 Apple 认可，用户首次打开仍要手动放行一次。
          codesign --force --deep --sign - "$APP"
          echo "===== 签名自检 ====="
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "----- 签名详情 -----"
          codesign -dv --verbose=4 "$APP" 2>&1 | sed -n '1,12p' || true
          echo "----- Gatekeeper 评估（未公证，预期被拒，仅留档）-----"
          spctl -a -t exec -vv "$APP" || true

      - name: 产物自检（不启动界面）
        run: |
          set -euo pipefail
          BUNDLE="$PWD/dist-unix/AIGC_Toolkit.app"   # 必须绝对：下面会 cd 进产物
          APP="$BUNDLE/Contents/MacOS"
          test -x "$APP/AIGC_Toolkit"
          echo "===== 产物布局（留档，别删）====="
          ls -la "$APP"
          ls -la "$BUNDLE/Contents" || true
          find "$BUNDLE" -maxdepth 6 -name app -type d -print
          du -sh "$BUNDLE"
          # macOS 的 BUNDLE 会把 _internal 在 Contents/Frameworks 与
          # Contents/Resources 之间交叉软链，具体哪层随版本变 —— 所以从
          # .app 根往下搜，只认"哪里有 app/main.py"
          APP_MAIN=$(find "$BUNDLE" -maxdepth 6 -type f -path '*/app/main.py' | head -1)
          test -n "$APP_MAIN" || { echo "产物里找不到 app/main.py"; exit 1; }
          APP_SRC=$(dirname "$APP_MAIN")
          test -f "$APP_SRC/first_run.py" || { echo "app/ 里缺 first_run.py"; exit 1; }
          echo "app/ 源码目录 = $APP_SRC"
          cd "$APP"
          ./runtime/python/bin/python3 -c \
            "import sys; sys.path.insert(0, sys.argv[1]); from core import platform_ops; print('OK', platform_ops.describe())" \
            "$APP_SRC"

      - name: 打 dmg
        run: |
          set -euo pipefail
          VER=$(sed -n 's/.*APP_VERSION *= *"\([^"]*\)".*/\1/p' app/core/meta.py | head -1)
          STAGE=dist-dmg
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a "dist-unix/AIGC_Toolkit.app" "$STAGE/"
          cat > "$STAGE/首次打开说明.txt" <<'EOF'
          AIGC 检测工具箱 · macOS 版

          这个应用没有购买苹果开发者签名证书（未签名），刚下载时系统会拦一下，
          属于正常现象。放行一次之后就正常了。

          怎么装：
            1. 把 AIGC_Toolkit.app 拖进「应用程序」文件夹

            2. 放行 —— 按你的 macOS 版本选一种：

               【macOS 15 Sequoia / 26 Tahoe 及更新】
                 a. 在「应用程序」里双击 AIGC_Toolkit，出现拦截提示后点「完成」
                    —— 千万别点「移到废纸篓」，那不是真的损坏
                 b. 打开「系统设置 → 隐私与安全性」，向下滚到底部的「安全性」
                 c. 点「仍要打开」，输入登录密码或用 Touch ID 确认
                 d. 再启动一次就能用了，以后正常双击

                 注意：「仍要打开」按钮只在刚才启动失败后的约 1 小时内出现，
                       看不到就再双击一次 App，然后立刻回到设置页。

               【macOS 14 及更早】
                 按住 Control 点 App（或右键）→ 选「打开」→ 再点一次「打开」

               【任何版本都通用，终端最省事】
                 打开「终端」，执行下面这行（路径按实际情况替换）：
                   xattr -dr com.apple.quarantine /Applications/AIGC_Toolkit.app

          首次启动要下载检测组件（约 0.2 GB，CPU 版），请保持网络畅通；
          装好之后就能完全离线使用。

          数据与组件都装在你的用户目录，不会写进系统目录：
            ~/Library/Application Support/AIGC_Toolkit
          想卸载：把 AIGC_Toolkit.app 拖进废纸篓，再删掉上面那个目录即可。
          EOF
          hdiutil create -volname "AIGC 检测工具箱" -srcfolder "$STAGE" -ov -format UDZO \
            "AIGC_Toolkit-${VER}-macos-$(uname -m).dmg"
          ls -lh AIGC_Toolkit-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: AIGC-Toolkit-macOS
          # 同 Linux job：dmg 里已经装了同一份 .app，不再重复上传整个目录
          path: AIGC_Toolkit-*.dmg

  release:
    name: 发布到 GitHub Release
    # 只在打 v* 标签时发布。推 main、手动触发都只构建，不产生 Release。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # 建 Release 要写权限；上面两个构建 job 仍只有 read
    steps:
      - uses: actions/checkout@v4

      - name: 取回三端产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理要发布的文件
        run: |
          set -euo pipefail
          mkdir -p release
          # Windows 安装器直接从仓库根取：PyInstaller 只能在本平台打包，
          # Linux runner 打不出 Windows exe，所以仓库根那份就是权威分发件。
          if [ -f AIGC_Toolkit_Setup.exe ]; then
            cp AIGC_Toolkit_Setup.exe release/
          else
            echo "::warning::仓库根没有 AIGC_Toolkit_Setup.exe，本次只发 Unix 产物"
          fi
          find artifacts -maxdepth 3 -name '*.AppImage' -exec cp {} release/ \;
          find artifacts -maxdepth 3 -name '*.dmg' -exec cp {} release/ \;
          echo "===== 本次发布 ====="
          ls -lh release/
          test -n "$(ls -A release)" || { echo "没有任何文件可发布"; exit 1; }

      - name: 建 Release 并上传
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 版本号自检：标签必须与源码里的版本一致，避免把 v1.3.5 发成 v1.3.4 的包
          VER=$(sed -n 's/.*APP_VERSION *= *"\([^"]*\)".*/\1/p' app/core/meta.py | head -1)
          echo "tag=$TAG 源码版本=$VER"
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::标签 $TAG 与源码版本 v$VER 不一致，拒绝发布"
            exit 1
          fi
          # 正文用仓库里的模板（含三端下载安装说明），不用 --generate-notes：
          # 仓库此前一个 Release 都没有时，它生成不出对比基准，正文会只剩
          # 一行 "Full Changelog" —— v1.3.4 首发就是这么空着的，得事后补。
          NOTES=/tmp/release-notes.md
          sed -e "s/{{TAG}}/$TAG/g" -e "s/{{VER}}/$VER/g" \
            .github/RELEASE_NOTES.md > "$NOTES"
          printf '\n---\n\n**本次全部提交**：https://github.com/%s/commits/%s\n' \
            "$GITHUB_REPOSITORY" "$TAG" >> "$NOTES"
          gh release create "$TAG" release/* \
            --title "AIGC 检测工具箱 $TAG" \
            --notes-file "$NOTES"
          gh release view "$TAG" --json url,assets \
            --jq '"发布地址: \(.url)", (.assets[] | "  \(.name)  \(.size) B")'
